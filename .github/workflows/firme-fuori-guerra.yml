---
# Riallinea il numero di adesioni all'appello "Fuori l'Italia dalla guerra".
#
# Gemello di firme-petizione.yml (petizione sanita' Calabria), stesso principio:
# gira sui server di GitHub, quindi anche a Mac spento, chiama lo strumento del
# repository che pubblica solo se il numero e' davvero cambiato e si ferma
# invece di indovinare.
#
# 9 settembre 2026 — chiesto da Fernando: lo stesso aggiornamento costante
# gia' attivo per la petizione Calabria, anche per questo appello. Prima ogni
# 30 minuti, poi Fernando ha chiesto ogni 5 (stesso giorno).
name: Firme fuori l'Italia dalla guerra

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: firme-fuori-guerra
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Leggi l'API del sito e riallinea l'articolo
        run: |
          git config user.email "webmaster.partecipazione.attiva@gmail.com"
          git config user.name "Partecipazione Attiva"
          python3 _tools/aggiorna_firme_fuori_guerra.py

  # 28/09/2026 — la petizione Calabria girava solo col cron interno di GitHub, che
  # la faceva partire ogni 3-6 ore invece che ogni 10 minuti (misurato: 8 giri in
  # 48 ore). Questo flusso invece e' richiamato ogni 5 minuti dallo script Google:
  # a giri alterni fa partire anche quello della petizione. Il GITHUB_TOKEN puo'
  # avviare un workflow_dispatch (eccezione documentata alla regola anti-ricorsione).
  # Autorizzato da Fernando il 28/09/2026 (regola di permesso aggiunta da lui).
  richiama-petizione:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Ogni 10 minuti, fai partire anche le firme Calabria
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( 10#$(date -u +%M) % 10 )) -lt 5 ]; then
            gh workflow run firme-petizione.yml -R "$GITHUB_REPOSITORY" && echo "petizione avviata"
          else
            echo "giro dispari: la petizione parte al prossimo"
          fi
